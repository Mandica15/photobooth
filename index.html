<form class="contact-form" id="contactForm">

    <div class="contact-fields">

        <!-- NUME -->
        <div class="form-field">

            <label for="contactName">
                Numele tău
            </label>

            <input
                type="text"
                id="contactName"
                name="name"
                autocomplete="name"
                placeholder="Ex: Alexandru Popescu"
                required
            >

        </div>


        <!-- TELEFON -->
        <div class="form-field">

            <label for="contactPhone">
                Număr de telefon
            </label>

            <input
                type="tel"
                id="contactPhone"
                name="phone"
                autocomplete="tel"
                placeholder="Ex: 0722 123 456"
                required
            >

        </div>


        <!-- EMAIL -->
        <div class="form-field">

            <label for="contactEmail">
                Adresa de email
            </label>

            <input
                type="email"
                id="contactEmail"
                name="email"
                autocomplete="email"
                placeholder="Ex: nume@email.ro"
                required
            >

        </div>


        <!-- TIP EVENIMENT -->
        <div class="form-field">

            <label for="eventType">
                Tipul evenimentului
            </label>

            <select
                id="eventType"
                name="eventType"
                required
            >

                <option
                    value=""
                    selected
                    disabled
                >
                    Alege o variantă
                </option>

                <option value="Nuntă">
                    Nuntă
                </option>

                <option value="Botez">
                    Botez
                </option>

                <option value="Majorat">
                    Majorat
                </option>

                <option value="Cununie">
                    Cununie
                </option>

                <option value="Aniversare">
                    Aniversare
                </option>

                <option value="Eveniment corporate">
                    Eveniment corporate
                </option>

                <option value="Alt tip de eveniment">
                    Alt tip de eveniment
                </option>

            </select>

        </div>


        <!-- DATA -->
        <div class="form-field">

            <label for="eventDate">
                Data evenimentului
            </label>

            <input
                type="date"
                id="eventDate"
                name="eventDate"
            >

        </div>


        <!-- LOCATIE -->
        <div class="form-field">

            <label for="eventLocation">
                Locația evenimentului
            </label>

            <input
                type="text"
                id="eventLocation"
                name="location"
                placeholder="Ex: Florești, Wonderland"
                required
            >

        </div>


        <!-- PACHET -->
        <div class="form-field form-field-full">

            <label for="contactPackage">
                Pachet
            </label>

            <select
                id="contactPackage"
                name="package"
                required
            >

                <option
                    value=""
                    selected
                    disabled
                >
                    Alege pachetul
                </option>

            </select>

        </div>


        <!-- MESAJ -->
        <div class="form-field form-field-full">

            <label for="contactMessage">
                Mesajul tău
            </label>

            <textarea
                id="contactMessage"
                name="message"
                rows="5"
                placeholder="Spune-ne orice alt detaliu important despre eveniment..."
            ></textarea>

        </div>

    </div>


    <!-- HONEYPOT ANTI-SPAM -->
    <div
        class="honeypot"
        aria-hidden="true"
    >

        <label for="contactWebsite">
            Website
        </label>

        <input
            type="text"
            id="contactWebsite"
            name="website"
            tabindex="-1"
            autocomplete="off"
        >

    </div>


    <!-- BUTON TRIMITERE -->
    <button
        class="btn btn-primary contact-submit"
        type="submit"
    >
        Cere o ofertă
    </button>


    <!-- MESAJ CONFIRMARE / EROARE -->
    <p
        class="contact-status"
        id="contactStatus"
        role="status"
        aria-live="polite"
    ></p>

</form>
